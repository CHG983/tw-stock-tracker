name: Apply README schedule change

# ONE-OFF: updates README.md's schedule section, then is deleted.
# NOTE: this job must NOT commit .github/workflows/* — the workflow's own token
# lacks the `workflows` permission, so such a push is rejected by GitHub.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the tar.gz holding the new README.md"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and validate README
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.url }}" -o /tmp/d.tar.gz
          rm -rf /tmp/d && mkdir -p /tmp/d
          tar -xzf /tmp/d.tar.gz -C /tmp/d
          test -f /tmp/d/README.md
          echo '--- size ---'
          wc -c /tmp/d/README.md
          echo '--- assertions ---'
          grep -q '13:32' /tmp/d/README.md
          grep -q '32 5 \* \* 1-5' /tmp/d/README.md
          grep -q '端點釋出時間' /tmp/d/README.md
          if grep -q '15:30' /tmp/d/README.md; then echo '::error::old time still present'; exit 1; fi
          if grep -q '| Cron | `30 7' /tmp/d/README.md; then echo '::error::old cron still in README'; exit 1; fi
          echo '--- integrity: keep the doc whole ---'
          grep -q '## 📁 專案結構' /tmp/d/README.md
          grep -q '## 🔄 自動更新' /tmp/d/README.md
          grep -q 'update-snapshot.yml' /tmp/d/README.md
          echo 'VALIDATION PASSED'

      - name: Commit README
        run: |
          set -euo pipefail
          cp /tmp/d/README.md README.md
          echo '--- diff stat ---'
          git --no-pager diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m "docs(readme): daily snapshot run is now 13:32 Asia/Taipei"
          git push
          echo '--- committed ---'
          git --no-pager log -1 --stat
          sha256sum README.md
