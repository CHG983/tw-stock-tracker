name: Deploy fix bundle

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the tar.gz bundle"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-fix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.url }}" -o /tmp/b.tar.gz
          echo "bytes: $(wc -c < /tmp/b.tar.gz)"
          head -c2 /tmp/b.tar.gz | od -An -tx1 | tr -d ' \n' | grep -qi '^1f8b' || { echo "::error::not gzip"; exit 1; }
          mkdir -p /tmp/b && tar -xzf /tmp/b.tar.gz -C /tmp/b
          for f in index.html tests/_harness.py tests/make_baseline.py tests/test_update_snapshot.py tests/fixtures/baseline_index.html; do
            test -f "/tmp/b/$f" || { echo "::error::missing $f"; exit 1; }
          done
          size=$(wc -c < /tmp/b/index.html)
          echo "index.html bytes: $size"
          [ "$size" -ge 250000 ] || { echo "::error::index.html too small"; exit 1; }
          grep -qF '/*SNAP:/FG_DATA*/' /tmp/b/index.html || { echo "::error::FG_DATA end marker not normalised"; exit 1; }
          grep -qF 'id="inst-yax-lo"' /tmp/b/index.html || { echo "::error::cum chart axis ids missing"; exit 1; }
          grep -qF 'inst-xlab-cum' /tmp/b/index.html || { echo "::error::cum x labels not data-driven"; exit 1; }
          grep -qF 'baseline_index.html' /tmp/b/tests/_harness.py || { echo "::error::harness not switched to baseline"; exit 1; }
          python3 -m py_compile /tmp/b/tests/_harness.py /tmp/b/tests/make_baseline.py /tmp/b/tests/test_update_snapshot.py
          python3 -c "import json,re,sys; s=open('/tmp/b/index.html',encoding='utf-8').read();
          m=re.search(r'SNAP:INST_DATA\\*/(.*?)/\\*SNAP:/INST_DATA\\*/', s, re.S); assert m, 'INST_DATA region unparsable';
          d=json.loads(re.search(r'=(\\{.*\\});?\\s*$', m.group(1), re.S).group(1)); assert len(d['rows'])==20, 'INST_DATA rows != 20'; print('INST_DATA ok', d['asOf'])"
          echo "validation OK"

      - name: Run unit tests
        run: |
          set -euo pipefail
          cp /tmp/b/index.html index.html
          cp /tmp/b/tests/_harness.py tests/_harness.py
          cp /tmp/b/tests/make_baseline.py tests/make_baseline.py
          cp /tmp/b/tests/test_update_snapshot.py tests/test_update_snapshot.py
          cp /tmp/b/tests/fixtures/baseline_index.html tests/fixtures/baseline_index.html
          python3 -m pytest tests/ -q 2>&1 | tail -12

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "Agent"
          git config user.email "agent@example.com"
          mkdir -p versions/v10
          cp index.html versions/v10/index.html
          git add -A
          git diff --cached --quiet || { git commit -m "fix: unbreak daily snapshot CI and make institutional text data-driven

- tests: read a frozen baseline instead of the live index.html, so the suite
  no longer fails once the scheduled job advances the snapshot past fixtures
  (this deadlock had failed all 12 scheduled runs since 2026-10-16)
- index.html: compute the institutional reading, cumulative axis ticks and
  x labels from INST_DATA instead of hardcoded 10/15 figures
- index.html: normalise the FG_DATA end marker to /*SNAP:/FG_DATA*/" ; git push; }
          sha256sum index.html
