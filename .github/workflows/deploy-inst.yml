name: Deploy from URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the archive to deploy"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.url }}" -o /tmp/pkg.tar.gz
          mkdir -p /tmp/pkg && tar -xzf /tmp/pkg.tar.gz -C /tmp/pkg
          test -f /tmp/pkg/index.html
          test -f /tmp/pkg/scripts/update_snapshot.py
          test -f /tmp/pkg/tests/_harness.py
          test -f /tmp/pkg/tests/capture_fixtures.py
          test -f /tmp/pkg/tests/test_update_snapshot.py
          test -f /tmp/pkg/tests/fixtures/meta.json
          n=$(ls /tmp/pkg/tests/fixtures/bfi82u/*.json | wc -l)
          echo "bfi82u fixtures: $n"
          test "$n" -ge 20
          test -f /tmp/pkg/assets/placeholder.none || true
          grep -q "INST_DATA" /tmp/pkg/index.html
          grep -q "SNAP:/INST_DATA" /tmp/pkg/index.html
          python3 -c "import json;json.load(open('/tmp/pkg/tests/fixtures/meta.json'))"
          python3 -c "import ast;ast.parse(open('/tmp/pkg/scripts/update_snapshot.py').read())"
          python3 -c "import ast;ast.parse(open('/tmp/pkg/tests/test_update_snapshot.py').read())"
          python3 -c "import ast;ast.parse(open('/tmp/pkg/tests/_harness.py').read())"
          python3 -c "import ast;ast.parse(open('/tmp/pkg/tests/capture_fixtures.py').read())"
          size=$(wc -c < /tmp/pkg/index.html); echo "index.html bytes: $size"
          test "$size" -ge 250000

      - name: Commit
        run: |
          set -euo pipefail
          cp /tmp/pkg/index.html index.html
          mkdir -p scripts tests/fixtures/bfi82u
          cp /tmp/pkg/scripts/update_snapshot.py scripts/update_snapshot.py
          cp /tmp/pkg/tests/_harness.py tests/_harness.py
          cp /tmp/pkg/tests/capture_fixtures.py tests/capture_fixtures.py
          cp /tmp/pkg/tests/test_update_snapshot.py tests/test_update_snapshot.py
          cp /tmp/pkg/tests/fixtures/meta.json tests/fixtures/meta.json
          cp /tmp/pkg/tests/fixtures/bfi82u/*.json tests/fixtures/bfi82u/
          git config user.name "Agent"
          git config user.email "agent@example.com"
          git add -A
          git diff --cached --quiet || { git commit -m "feat(cron): auto-update the institutional-flow snapshot (INST_DATA) daily at 15:30 Taipei"; git push; }
          sha256sum index.html scripts/update_snapshot.py tests/test_update_snapshot.py
