name: Deploy from URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the bundle to deploy"
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and validate
        run: |
          set -euo pipefail
          curl -fsSL -A "curl/8" "${{ inputs.url }}" -o /tmp/bundle.tar.gz
          head -c2 /tmp/bundle.tar.gz | od -An -tx1 | tr -d ' \n' | grep -qi '^1f8b' || { echo "::error::not a gzip archive"; exit 1; }
          mkdir -p /tmp/bundle
          tar -xzf /tmp/bundle.tar.gz -C /tmp/bundle
          for f in tests/test_update_snapshot.py scripts/update_snapshot.py README.md; do
            test -f "/tmp/bundle/$f" || { echo "::error::missing $f"; exit 1; }
          done
          cp /tmp/bundle/tests/test_update_snapshot.py tests/test_update_snapshot.py
          cp /tmp/bundle/scripts/update_snapshot.py scripts/update_snapshot.py
          cp /tmp/bundle/README.md README.md
          python3 -m py_compile scripts/update_snapshot.py tests/test_update_snapshot.py
          grep -qF 'have a single hourly cron' tests/test_update_snapshot.py || { echo "::error::test update missing"; exit 1; }
          echo "validation OK"
          sha256sum tests/test_update_snapshot.py scripts/update_snapshot.py README.md

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t .

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          # [skip ci]: the sibling update-snapshot.yml lands in a separate API commit;
          # do not run CI on this intermediate half-updated tree.
          git commit -m "docs(test): align schedule test and docs with hourly cadence [skip ci]"
          git push
