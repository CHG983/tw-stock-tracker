name: Deploy from URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the bundle to deploy"
        required: true
        type: string

permissions:
  contents: write
  # Required: the bundle contains .github/workflows/update-snapshot.yml, and
  # GitHub refuses a token without `workflows` permission to touch a workflow file.
  workflows: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and validate
        run: |
          set -euo pipefail
          curl -fsSL -A "curl/8" "${{ inputs.url }}" -o /tmp/bundle.tar.gz
          head -c2 /tmp/bundle.tar.gz | od -An -tx1 | tr -d ' \n' | grep -qi '^1f8b' || { echo "::error::not a gzip archive"; exit 1; }
          mkdir -p /tmp/bundle
          tar -xzf /tmp/bundle.tar.gz -C /tmp/bundle
          for f in .github/workflows/update-snapshot.yml tests/test_update_snapshot.py scripts/update_snapshot.py README.md; do
            test -f "/tmp/bundle/$f" || { echo "::error::missing $f"; exit 1; }
          done
          cp /tmp/bundle/.github/workflows/update-snapshot.yml .github/workflows/update-snapshot.yml
          cp /tmp/bundle/tests/test_update_snapshot.py tests/test_update_snapshot.py
          cp /tmp/bundle/scripts/update_snapshot.py scripts/update_snapshot.py
          cp /tmp/bundle/README.md README.md
          python3 -m py_compile scripts/update_snapshot.py tests/test_update_snapshot.py
          grep -qF 'cron: "0 * * * 1-5"' .github/workflows/update-snapshot.yml || { echo "::error::hourly cron missing"; exit 1; }
          if grep -qF 'cron: "32 5 * * 1-5"' .github/workflows/update-snapshot.yml; then echo "::error::old 13:32 cron still present"; exit 1; fi
          if grep -qF 'cron: "35 7 * * 1-5"' .github/workflows/update-snapshot.yml; then echo "::error::old 15:35 cron still present"; exit 1; fi
          grep -qF 'github.event.schedule' .github/workflows/update-snapshot.yml || { echo "::error::schedule guard missing"; exit 1; }
          echo "validation OK"
          sha256sum .github/workflows/update-snapshot.yml tests/test_update_snapshot.py scripts/update_snapshot.py README.md

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t .

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "ci(schedule): run snapshot update hourly (Taipei, Mon-Fri)"
          git push
