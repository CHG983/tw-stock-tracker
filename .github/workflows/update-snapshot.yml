name: Update snapshot

# 每個交易日台股收盤後，自動抓取臺灣證券交易所公開資料並更新 index.html 的內建快照。
#
# 排程（台北時間 UTC+8，週一至週五）：每小時執行 1 次。
#   cron "0 * * * 1-5" 是 UTC 的整點；UTC 週一至週五的整點換算成台北時間，
#   涵蓋台北週一 08:00 至週六 08:00，因此每個交易日的盤後時段都會被多次涵蓋，
#   資料一釋出就會自動更新，不必等固定時間。
#
# 為什麼要每小時多次：證交所盤後統計端點的釋出時間不一致且常有延遲 ——
#   STOCK_DAY_ALL 約 13:52–13:54 才換日、MI_INDEX 更晚、三大法人 BFI82U 約 15:10 才公布。
#   若只跑單一固定時間，一旦剛好落在資料尚未釋出時，當天就完全不會更新；
#   改成每小時重試可自動吸收這個不確定性，不需要猜時間。
#
# 因此所有「排程觸發」一律帶 --allow-not-ready：
#   端點尚未釋出當日資料時視為「本次略過」—— 不寫檔、以 0 結束（workflow 保持綠燈、
#   不寄失敗通知），下一個整點再試。
#   這只涵蓋「尚未釋出」；真正的錯誤（HTTP 500、壞 JSON、缺欄位、合計不符、
#   缺成交統計表…）在任何情況下都會失敗（見 update step 的說明）。
#   手動觸發（workflow_dispatch）刻意不帶此旗標：人工跑就是為了嚴格檢查。
on:
  schedule:
    - cron: "0 * * * 1-5"
  workflow_dispatch:

# 需要寫入權限才能把更新後的 index.html 推回 main。
permissions:
  contents: write

# 避免多個排程（或排程與手動觸發）同時執行而互相覆蓋。
concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  # 測試必須先通過，才會進行快照更新與 commit。
  # 測試完全不連網（以 tests/fixtures/ 的真實 TWSE 回應樣本取代所有請求），
  # 因此不會因證交所端點異常而卡住 CI。
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只用標準函式庫 unittest，無需 pip install。
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t . -v

  update:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只用標準函式庫，無需 pip install。
      # 腳本以實際抓到的數字更新快照；任何抓取 / 解析 / 一致性驗證失敗都會
      # 以非 0 結束且不寫入檔案，因此這個 step 失敗時 index.html 保持原樣。
      # 腳本結尾輸出 CHANGED=1 / CHANGED=0，代表「資料本身」是否有變更
      # （時間戳不計入），據以決定是否建立 commit。
      #
      # 排程觸發一律帶 --allow-not-ready：端點尚未釋出當日資料時視為「本次略過」，
      # 不寫檔並以 0 結束（CHANGED=0 → 不建立 commit），讓 workflow 保持綠燈；
      # 手動觸發不帶此旗標，資料不齊即失敗，方便人工嚴格檢查。
      - name: Update snapshot from TWSE
        id: upd
        run: |
          set -euo pipefail
          extra=""
          if [ -n "${{ github.event.schedule }}" ]; then
            extra="--allow-not-ready"
            echo "排程觸發（cron：${{ github.event.schedule }}）：端點尚未釋出當日資料時略過而不失敗。"
          else
            echo "手動觸發：資料不齊即失敗（嚴格檢查）。"
          fi
          python3 scripts/update_snapshot.py --file index.html $extra | tee /tmp/snapshot.log
          changed="$(sed -n 's/.*CHANGED=\([01]\).*/\1/p' /tmp/snapshot.log | tail -n1)"
          echo "changed=${changed:-0}" >> "$GITHUB_OUTPUT"

      - name: Commit and push if snapshot changed
        if: steps.upd.outputs.changed == '1'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(snapshot): 自動更新 TWSE 快照 ($(TZ=Asia/Taipei date +%Y-%m-%d))"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### TWSE 快照更新"
            echo ""
            echo "- 觸發排程：\`${{ github.event.schedule || 'workflow_dispatch' }}\`"
            echo "- 資料變更：\`${{ steps.upd.outputs.changed || 'n/a' }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
