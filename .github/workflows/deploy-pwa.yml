name: Deploy PWA from URL
on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the tar.gz to deploy"
        required: true
        type: string
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate
        run: |
          set -euo pipefail
          curl -fsSL "${{ inputs.url }}" -o /tmp/pwa.tar.gz
          mkdir -p /tmp/pwa && tar -xzf /tmp/pwa.tar.gz -C /tmp/pwa
          ls -la /tmp/pwa
          test -f /tmp/pwa/index.html
          test -f /tmp/pwa/manifest.json
          test -f /tmp/pwa/sw.js
          test -f /tmp/pwa/icons/icon-512.png
          test -f /tmp/pwa/icons/icon-maskable-512.png
          test -f /tmp/pwa/icons/apple-touch-icon.png
          grep -q 'rel="manifest"' /tmp/pwa/index.html
          grep -q 'serviceWorker' /tmp/pwa/index.html
          grep -q 'btn-install' /tmp/pwa/index.html
          grep -q 'fg-gauge-svg' /tmp/pwa/index.html
          python3 -c "import json;json.load(open('/tmp/pwa/manifest.json'))"
          node --check /tmp/pwa/sw.js
          echo "validation OK"
      - name: Commit
        run: |
          set -euo pipefail
          cp /tmp/pwa/index.html index.html
          cp /tmp/pwa/manifest.json manifest.json
          cp /tmp/pwa/sw.js sw.js
          mkdir -p icons && cp /tmp/pwa/icons/* icons/
          cp /tmp/pwa/tests/test_update_snapshot.py tests/test_update_snapshot.py
          mkdir -p versions/v8 && cp /tmp/pwa/index.html versions/v8/index.html
          git config user.name "Agent"
          git config user.email "agent@example.com"
          git add -A
          git diff --cached --quiet || { git commit -m "feat: add PWA support (manifest, service worker, icons, install UX)"; git push; }
          sha256sum index.html manifest.json sw.js
